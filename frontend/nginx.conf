server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Was missing entirely, which meant every static asset - including large dynamically-
    # imported chunks like exceljs (~939KB minified) and xlsx (~500KB) - was served byte-for-
    # byte uncompressed. gzip alone gets exceljs down to ~270KB over the wire; nginx:alpine
    # ships gzip built in, so this needs no image change.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/wasm font/woff2 image/svg+xml;

    # SPA: any route not matching a real static file falls back to index.html so
    # React Router handles it client-side (e.g. /orders/5, /products/new on a hard refresh).
    location / {
        try_files $uri /index.html;
    }

    # Vite build output under dist/assets/ has a content hash in every filename (e.g.
    # exceljs.min-C2IQDFC6.js) - a new deploy always produces new filenames, so these are safe
    # to cache aggressively; the browser only re-downloads a chunk when its content actually
    # changed. index.html itself is NOT covered here (it's served by the "/" block above with
    # no special caching) since it references those hashed filenames and must always be fetched
    # fresh so a new deploy is picked up instead of serving a stale asset list.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything below is proxied to the Go backend, which mounts /api, /uploads and /health
    # at its own root (not all under /api) - see backend/cmd/api/main.go.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
