:root{--color-primary:#FF8C69;--color-on-primary:#2B2B2E;--color-primary-hover:#F7795A;--color-primary-strong:#B8432D;--color-primary-soft:#FFEDE6;--color-secondary:#FFC9B8;--color-bg:#FFFFFF;--color-bg-soft:#F7F7F8;--color-surface:#FFFFFF;--color-text:#2B2B2E;--color-text-2:#5F6168;--color-text-3:#6B6E76;--color-disabled:#9AA0A6;--color-border:#ECEDEF;--color-border-strong:#8C9098;--color-success:#2E7D52;--color-success-bg:#E8F5EE;--color-warning:#9A5B00;--color-warning-bg:#FFF4E5;--color-error:#C62828;--color-error-bg:#FDECEC;--color-info:#2F6FA3;--color-live:#D32F2F;--color-live-soft:#FAD4D1;--color-coupon-bg:#FFF4EF}
body{margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:var(--color-primary-strong)}a:hover{color:var(--color-text)}
@keyframes csShake{0%,84%,100%{transform:rotate(0)}86%{transform:rotate(-14deg)}88%{transform:rotate(12deg)}90%{transform:rotate(-10deg)}92%{transform:rotate(8deg)}94%{transform:rotate(0)}}
.cs-shake{animation:csShake 3.5s ease-in-out infinite;transform-origin:50% 60%}
@keyframes csFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cs-tip{animation:csFloat 2.4s ease-in-out infinite}
@keyframes langMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lang-track{display:flex;align-items:center;gap:8px;width:max-content;animation:langMarquee 22s linear infinite}
.lang-track:hover{animation-play-state:paused}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(201,60,41,0.6)}70%{box-shadow:0 0 0 12px rgba(201,60,41,0)}100%{box-shadow:0 0 0 0 rgba(201,60,41,0)}}
.live-pulse{animation:livePulse 1.6s ease-out infinite}
@keyframes liveDot{50%{opacity:.25}}
.live-dot{animation:liveDot 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.cs-shake,.cs-tip,.lang-track,.live-pulse,.live-dot{animation:none}}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.skel{animation:shimmer 1.2s ease-in-out infinite}
h1,h2,.serif{font-family:'Noto Serif TC','Songti TC',serif;letter-spacing:.3px}
</style>
