# Keep the scheme the outer (TLS-terminating) proxy saw, so canonical URLs / Open Graph urls are https.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA: unknown paths fall back to index.html so React Router handles /p/12, /checkout...
    # SSI pulls the per-page <head> (title, description, canonical, robots, JSON-LD) from the backend
    # into index.html so crawlers and link previews see it without running JavaScript.
    location / {
        ssi on;
        ssi_silent_errors on;
        ssi_types text/html;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Sitemap (products, hosts, articles under /{lang}/style/...) comes from the backend; robots.txt points to it.
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/public/store/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nSitemap: $fwd_proto://$host/sitemap.xml\n";
    }

    # Vite output under /assets/ is content-hashed, safe to cache for a year. Favicons and
    # index.html are NOT under /assets/, so they stay revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SSI includes in index.html (SEO head + crawlable article text) are subrequests answered by the backend, which
    # gzips text/html. nginx SSI cannot decompress, so the compressed bytes would be pasted into the page as junk.
    # Ask the backend for an uncompressed answer on these two endpoints only (the browser still gets the page gzipped).
    location ^~ /api/public/store/seo {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Accept-Encoding "";
    }

    # Same-origin API + uploaded product photos, proxied to the Go backend (same as the admin).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
